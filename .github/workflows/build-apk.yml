name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Landscape, fullscreen, app icon
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          cp android-overrides/MainActivity.java android/app/src/main/java/com/cargotruck/driver/MainActivity.java
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            mkdir -p "$RES/mipmap-$name"
            convert www/assets/icon-512.png -resize ${size}x${size} "$RES/mipmap-$name/ic_launcher.png"
            cp "$RES/mipmap-$name/ic_launcher.png" "$RES/mipmap-$name/ic_launcher_round.png"
            cp "$RES/mipmap-$name/ic_launcher.png" "$RES/mipmap-$name/ic_launcher_foreground.png"
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Version number (higher every build, so phones install it as an update)
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Build release APK + AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Repo secret KEYSTORE_BASE64 is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out CargoTruckDriver.apk aligned.apk
          "$BT/apksigner" verify --print-certs CargoTruckDriver.apk
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -signedjar CargoTruckDriver.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm -f release.jks aligned.apk

      - name: Upload APK + AAB (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CargoTruckDriver-${{ github.run_number }}
          path: |
            CargoTruckDriver.apk
            CargoTruckDriver.aab

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Cargo Truck Driver 1.${{ github.run_number }}
          body: |
            CargoTruckDriver.apk: install on Android (it updates the previous version, progress is kept).
            CargoTruckDriver.aab: upload to Google Play Console.
          files: |
            CargoTruckDriver.apk
            CargoTruckDriver.aab
