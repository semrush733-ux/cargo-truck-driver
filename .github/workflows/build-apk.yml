name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Landscape, fullscreen, app icon
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          cp android-overrides/MainActivity.java android/app/src/main/java/com/cargotruck/driver/MainActivity.java
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; size=${d##*:}
            mkdir -p "$RES/mipmap-$name"
            convert www/assets/icon-512.png -resize ${size}x${size} "$RES/mipmap-$name/ic_launcher.png"
            cp "$RES/mipmap-$name/ic_launcher.png" "$RES/mipmap-$name/ic_launcher_round.png"
            cp "$RES/mipmap-$name/ic_launcher.png" "$RES/mipmap-$name/ic_launcher_foreground.png"
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CargoTruckDriver.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CargoTruckDriver-apk
          path: CargoTruckDriver.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cargo Truck Driver build ${{ github.run_number }}
          body: Install CargoTruckDriver.apk on your Android phone (allow "Install unknown apps").
          files: CargoTruckDriver.apk
